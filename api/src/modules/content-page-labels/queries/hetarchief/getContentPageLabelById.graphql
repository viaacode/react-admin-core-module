query getContentPageLabelById($id: uuid!) {
	app_content_label(where: { id: { _eq: $id } }) {
		label
		id
		content_type
		link_to
		language
		color
		nl_parent_label_id
		nl_parent_label {
			id
			label
			language
		}
		translated_labels {
			id
			label
			language
		}
		created_at
		updated_at
	}
}
